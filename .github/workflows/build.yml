name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mupen64PlusAE-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Build release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_ORG: ${{ secrets.SIGNING_ORG }}
          SIGNING_ORG_UNIT: ${{ secrets.SIGNING_ORG_UNIT }}
          SIGNING_CITY: ${{ secrets.SIGNING_CITY }}
          SIGNING_STATE: ${{ secrets.SIGNING_STATE }}
          SIGNING_COUNTRY: ${{ secrets.SIGNING_COUNTRY }}
        run: |
          : "${KEYSTORE_PASSWORD:=mupen64plusae}"
          : "${KEY_ALIAS:=mupen64plusae}"
          : "${KEY_PASSWORD:=mupen64plusae}"
          : "${SIGNING_ORG:=Mupen64PlusAE}"
          : "${SIGNING_ORG_UNIT:=Mupen64PlusAE}"
          : "${SIGNING_CITY:=Unknown}"
          : "${SIGNING_STATE:=Unknown}"
          : "${SIGNING_COUNTRY:=US}"
          keytool -genkeypair -v -keystore release.keystore -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=$SIGNING_ORG, OU=$SIGNING_ORG_UNIT, L=$SIGNING_CITY, ST=$SIGNING_STATE, C=$SIGNING_COUNTRY"
          printf 'storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::warning::No KEYSTORE_PASSWORD secret set, using ephemeral keystore. Release will NOT be upgradeable."
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true